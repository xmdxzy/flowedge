name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: cd backend && go build ./...
      - name: Vet
        run: cd backend && go vet ./...
      - name: Test
        run: cd backend && go test ./... -count=1

  frontend:
    name: Frontend (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd frontend && npm ci
      - name: Type check
        run: cd frontend && npx tsc --noEmit
      - name: Unit tests
        # 零新增依赖：esbuild（vite 自带）打包 *.test.ts，node:test 执行。
        # 其中包含前后端契约测试（后端节点类型必须出现在调色板里）。
        run: cd frontend && npm test
      - name: Build
        run: cd frontend && npm run build

  gates:
    name: Quality gates (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: film-gates self-check
        run: python scripts/film-gates.py --help >/dev/null && echo "film-gates importable"
