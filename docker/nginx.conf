# 前端是 SPA，实时看板走 /api/ws（同源同路径）。
# WebSocket 握手需要 Upgrade/Connection 头；默认 Connection 是 close，
# 直接代理会让握手失败、界面显示「实时已断开」——而 REST 刷新照常可用，
# 所以这个 bug 很容易被当成「偶发」忽略。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容哈希，可以长缓存；壳不能缓存，否则升级后仍指向旧 chunk
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 一条出片可能跑十几分钟：默认 60s 会掐断 WS 与长请求
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 事件流要即时吐出，攒包会让进度条一顿一顿
        proxy_buffering off;
    }
}
